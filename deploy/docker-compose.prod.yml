services:
  postgres:
    image: postgres:16
    container_name: muse-postgres
    restart: unless-stopped
    networks:
      - muse-network
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: muse-redis
    restart: unless-stopped
    networks:
      - muse-network
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: muse-prometheus
    restart: unless-stopped
    profiles: [ "monitoring" ]
    networks:
      - muse-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}"
    volumes:
      - ./monitoring/prometheus/prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_started
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    container_name: muse-grafana
    restart: unless-stopped
    profiles: [ "monitoring" ]
    networks:
      - muse-network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: muse-postgres-exporter
    restart: unless-stopped
    profiles: [ "monitoring" ]
    networks:
      - muse-network
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    container_name: muse-redis-exporter
    restart: unless-stopped
    profiles: [ "monitoring" ]
    networks:
      - muse-network
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE}
    container_name: muse-backend
    restart: unless-stopped
    networks:
      - muse-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET}
      SOLAPI_SENDER_PHONE_NUMBER: ${SOLAPI_SENDER_PHONE_NUMBER}
      MUSE_ALL_USER_IMPORT_ENABLED: ${MUSE_ALL_USER_IMPORT_ENABLED:-false}
      MUSE_ALL_USER_CSV_PATH: ${MUSE_ALL_USER_CSV_PATH:-}
      MUSE_IMAGE_S3_BUCKET: ${MUSE_IMAGE_S3_BUCKET}
      MUSE_IMAGE_S3_REGION: ${MUSE_IMAGE_S3_REGION:-ap-northeast-2}
      MUSE_IMAGE_CLOUDFRONT_DOMAIN: ${MUSE_IMAGE_CLOUDFRONT_DOMAIN:-}
      MUSE_IMAGE_LAMBDA_CALLBACK_TOKEN: ${MUSE_IMAGE_LAMBDA_CALLBACK_TOKEN}
      MUSE_IMAGE_AWS_ACCESS_KEY_ID: ${MUSE_IMAGE_AWS_ACCESS_KEY_ID:-}
      MUSE_IMAGE_AWS_SECRET_ACCESS_KEY: ${MUSE_IMAGE_AWS_SECRET_ACCESS_KEY:-}
      MUSE_IMAGE_MAX_UPLOAD_SIZE_BYTES: ${MUSE_IMAGE_MAX_UPLOAD_SIZE_BYTES:-20971520}
    volumes:
      - ./data:/app/data:ro
    expose:
      - "8080"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: muse-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    networks:
      - muse-network
    depends_on:
      backend:
        condition: service_started
        restart: true
    expose:
      - "80"

  certbot:
    image: certbot/certbot:latest
    container_name: muse-certbot
    profiles:
      - ops
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  nginx:
    image: nginx:1.27-alpine
    container_name: muse-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    networks:
      - muse-network
    depends_on:
      frontend:
        condition: service_started
        restart: true
      backend:
        condition: service_started
        restart: true
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro
    ports:
      - "80:80"
      - "443:443"

networks:
  muse-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
